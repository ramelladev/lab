apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik-system
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "42.*"

      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik-system
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
