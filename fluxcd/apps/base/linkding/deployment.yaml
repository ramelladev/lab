apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: linkding
  name: linkding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      securityContext:
        fsGroup: 33
        runAsUser: 33
        runAsGroup: 33

      containers:
      - image: sissbruecker/linkding:1.47.0
        name: linkding
        ports:
          - containerPort: 9090
# My answer to setting environment variables for linkding
        env:
          - name: LD_SUPERUSER_NAME
            valueFrom:
              secretKeyRef:
                name: linkding-secrets
                key: superuser-name

          - name: LD_SUPERUSER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: linkding-secrets
                key: superuser-pass

# Answer from KubeCraft Career Accelerator:
#        envFrom:
#          - secretRef:
#              name: linkding-container-env
#              
        securityContext:
          allowPrivilegeEscalation: false

        volumeMounts:
          - name: linkding-data
            mountPath: /etc/linkding/data

      volumes:
        - name: linkding-data
          persistentVolumeClaim:
            claimName: linkding-data-pvc
