apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: audiobookshelf
  name: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000

      containers:
      - image: ghcr.io/advplyr/audiobookshelf:2.38.0
        name: audiobookshelf
        securityContext:
          allowPrivilegeEscalation: false
        envFrom:
          - configMapRef:
              name: audiobookshelf-configmap
        volumeMounts:
          - name: audiobookshelf-metadata
            mountPath: /metadata
          - name: audiobookshelf-config
            mountPath: /config
          - name: audiobookshelf-audiobooks
            mountPath: /audiobooks

      volumes:
        - name: audiobookshelf-metadata
          persistentVolumeClaim:
            claimName: audiobookshelf-metadata-pvc
        - name: audiobookshelf-config
          persistentVolumeClaim:
            claimName: audiobookshelf-config-pvc
        - name: audiobookshelf-audiobooks
          persistentVolumeClaim:
            claimName: audiobookshelf-audiobooks-pvc
